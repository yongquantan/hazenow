# XcodeGen spec for HazeNow (Apple). Regenerate with:  cd apps/apple && xcodegen generate
name: HazeNow
options:
  bundleIdPrefix: sg.hazenow
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""            # set your Team ID to sign (see README)
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

packages:
  HazeKit:
    path: HazeKit

targets:
  # ───────────────────────────── macOS ─────────────────────────────
  HazeNowMac:
    type: application
    platform: macOS
    sources:
      - Mac
    dependencies:
      - package: HazeKit
        product: HazeKit
      - package: HazeKit
        product: HazeUI
      - target: HazeNowMacWidgets
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: HazeNow
        CFBundleName: HazeNow
        LSUIElement: true
        CFBundleURLTypes:
          - CFBundleURLName: sg.hazenow
            CFBundleURLSchemes: [hazenow]
        LSApplicationCategoryType: public.app-category.weather
        NSHumanReadableCopyright: "MIT License. Data: NEA via data.gov.sg"
        NSLocationUsageDescription: "HazeNow uses your approximate location to weight nearby NEA stations. It never leaves your Mac."
        NSLocationWhenInUseUsageDescription: "HazeNow uses your approximate location to weight nearby NEA stations. It never leaves your Mac."
    entitlements:
      path: Mac/HazeNowMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.personal-information.location: true
        com.apple.security.application-groups: [group.sg.hazenow]
    settings:
      base:
        PRODUCT_NAME: HazeNow
        PRODUCT_BUNDLE_IDENTIFIER: sg.hazenow.mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES

  HazeNowMacWidgets:
    type: app-extension
    platform: macOS
    sources:
      - path: Widgets
        excludes: ["*.plist", "*.entitlements"]
    dependencies:
      - package: HazeKit
        product: HazeKit
      - package: HazeKit
        product: HazeUI
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Widgets/Info-macOS.plist
      properties:
        CFBundleDisplayName: HazeNow
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/HazeNowMacWidgets.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups: [group.sg.hazenow]
    settings:
      base:
        PRODUCT_NAME: HazeNowWidgets
        PRODUCT_BUNDLE_IDENTIFIER: sg.hazenow.mac.widgets
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES

  # ────────────────────────────── iOS ──────────────────────────────
  HazeNowiOS:
    type: application
    platform: iOS
    sources:
      - iOS
      - Shared
    dependencies:
      - package: HazeKit
        product: HazeKit
      - package: HazeKit
        product: HazeUI
      - target: HazeNowiOSWidgets
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: HazeNow
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: sg.hazenow
            CFBundleURLSchemes: [hazenow]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown,
           UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocationWhenInUseUsageDescription: "HazeNow uses your approximate location to weight nearby NEA stations. It never leaves your phone."
    entitlements:
      path: iOS/HazeNowiOS.entitlements
      properties:
        com.apple.security.application-groups: [group.sg.hazenow]
    settings:
      base:
        PRODUCT_NAME: HazeNow
        PRODUCT_BUNDLE_IDENTIFIER: sg.hazenow.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"

  HazeNowiOSWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes: ["*.plist", "*.entitlements"]
      - Shared
    dependencies:
      - package: HazeKit
        product: HazeKit
      - package: HazeKit
        product: HazeUI
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
    info:
      path: Widgets/Info-iOS.plist
      properties:
        CFBundleDisplayName: HazeNow
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/HazeNowiOSWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.sg.hazenow]
    settings:
      base:
        PRODUCT_NAME: HazeNowWidgets
        PRODUCT_BUNDLE_IDENTIFIER: sg.hazenow.ios.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES

  # ──────────────────── watchOS (independent app + complications) ────────────────────
  HazeNowWatch:
    type: application
    platform: watchOS
    sources:
      - Watch/App
    dependencies:
      - package: HazeKit
        product: HazeKit
      - package: HazeKit
        product: HazeUI
      - target: HazeNowWatchComplications
    info:
      path: Watch/App/Info.plist
      properties:
        CFBundleDisplayName: HazeNow
        WKApplication: true
        WKWatchOnly: true
        NSLocationWhenInUseUsageDescription: "HazeNow uses your approximate location to weight nearby NEA stations. It never leaves your watch."
    entitlements:
      path: Watch/App/HazeNowWatch.entitlements
      properties:
        com.apple.security.application-groups: [group.sg.hazenow]
    settings:
      base:
        PRODUCT_NAME: HazeNow
        PRODUCT_BUNDLE_IDENTIFIER: sg.hazenow.watch
        TARGETED_DEVICE_FAMILY: "4"

  HazeNowWatchComplications:
    type: app-extension
    platform: watchOS
    sources:
      - Watch/Complications
    dependencies:
      - package: HazeKit
        product: HazeKit
      - package: HazeKit
        product: HazeUI
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Watch/Complications/Info.plist
      properties:
        CFBundleDisplayName: HazeNow
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Watch/Complications/HazeNowWatchComplications.entitlements
      properties:
        com.apple.security.application-groups: [group.sg.hazenow]
    settings:
      base:
        PRODUCT_NAME: HazeNowComplications
        PRODUCT_BUNDLE_IDENTIFIER: sg.hazenow.watch.complications
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES

schemes:
  HazeNowMac:
    build:
      targets:
        HazeNowMac: all
    run:
      config: Debug
  HazeNowiOS:
    build:
      targets:
        HazeNowiOS: all
    run:
      config: Debug
  HazeNowWatch:
    build:
      targets:
        HazeNowWatch: all
    run:
      config: Debug
