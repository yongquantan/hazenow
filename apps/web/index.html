<!doctype html>
<html lang="en-SG">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>HazeNow · Singapore haze right now</title>
    <meta name="description" content="Is it OK to be out right now? NEA's latest 1-hr PM2.5 for your area, in plain words, next to NEA's 24-hr PSI. Free, open source, no ads, no tracking." />
    <meta name="theme-color" content="#F3F1EC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14232B" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="canonical" href="https://hazenow.pages.dev/" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/icons/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="icon" href="/icons/favicon-48.png" sizes="48x48" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HazeNow" />
    <meta property="og:title" content="HazeNow · Air right now, near you" />
    <meta property="og:description" content="NEA's latest hourly PM2.5 for your area, in plain words. Both numbers are from NEA: the PSI averages 24 hours, PM2.5 shows the last hour." />
    <meta property="og:url" content="https://hazenow.pages.dev/" />

    <link rel="preconnect" href="https://api-open.data.gov.sg" crossorigin />
    <link rel="preload" href="/fonts/apfel-grotezk-regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/apfel-grotezk-mittel.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="app">
      <main class="boot" aria-busy="true">
        <p class="boot-mark">HazeNow</p>
        <p class="boot-line">Getting NEA's latest reading…</p>
      </main>
    </div>
    <noscript><p style="padding:24px">HazeNow needs JavaScript to fetch NEA's latest readings from data.gov.sg.</p></noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
