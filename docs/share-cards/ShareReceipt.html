<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Share card: haze receipt on your photo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Apfel Grotezk';src:url(/_blob/7bbf2d2961f8f71175d54522f4495026) format('woff2');font-weight:400}@font-face{font-family:'Apfel Grotezk';src:url(/_blob/9904fa6eee09b2961b48fce95531de93) format('woff2');font-weight:500}@font-face{font-family:'Apfel Grotezk';src:url(/_blob/07d4a5f18b60be5df28dec511c3309d5) format('woff2');font-weight:700}
body{margin:0;font-family:'Apfel Grotezk',system-ui,sans-serif;background:#BDB6A3;color:#14232B}
</style>
</helmet>
<div style="width: 1080px; height: 1920px; position: relative; overflow: hidden; background: #CFC7B2">

<div style="position: absolute; left: 0; top: 0; right: 0; height: 1920px; display: flex; flex-direction: column">
<div style="height: 760px; background: #D8D0BB"></div>
<div style="height: 260px; background: #CBC2AB"></div>
<div style="height: 900px; background: #A9A28F"></div>
</div>
<div style="position: absolute; left: 0; right: 0; top: 700px; height: 420px; display: flex; align-items: flex-end; gap: 14px; padding: 0 40px; opacity: 0.55">
<div style="width: 90px; height: 180px; background: #8F8A7C"></div>
<div style="width: 70px; height: 300px; background: #8F8A7C"></div>
<div style="width: 120px; height: 240px; background: #8F8A7C"></div>
<div style="width: 60px; height: 380px; background: #8F8A7C"></div>
<div style="width: 100px; height: 330px; background: #8F8A7C"></div>
<div style="width: 140px; height: 200px; background: #8F8A7C"></div>
<div style="width: 80px; height: 410px; background: #8F8A7C"></div>
<div style="width: 110px; height: 270px; background: #8F8A7C"></div>
<div style="width: 90px; height: 160px; background: #8F8A7C"></div>
</div>
<div style="position: absolute; left: 40px; top: 48px; font-size: 22px; color: #5A5548; background: rgba(255,255,255,0.5); padding: 6px 12px; border-radius: 8px">[ Photo taken in the HazeNow camera, full bleed ]</div>

<div style="position: absolute; left: 64px; right: 64px; bottom: 96px; background: #FBF8F1; border-radius: 20px; padding: 48px 52px; display: flex; flex-direction: column; gap: 26px; font-family: 'JetBrains Mono', ui-monospace, monospace; box-shadow: 0 20px 50px rgba(20,35,43,0.25)">
<div style="display: flex; justify-content: space-between; align-items: center">
<div style="font-size: 28px; font-weight: 600; letter-spacing: 0.12em">HAZE RECEIPT</div>
<svg width="48" height="48" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="38" r="17" fill="#E8A317"></circle><rect x="17" y="61" width="66" height="7.5" rx="3.75" fill="#14232B"></rect><rect x="27" y="73.5" width="46" height="7.5" rx="3.75" fill="#14232B" opacity="0.7"></rect><rect x="38" y="86" width="24" height="7.5" rx="3.75" fill="#14232B" opacity="0.45"></rect></svg>
</div>
<div style="display: flex; flex-direction: column; gap: 10px; font-size: 26px; color: #3D4F57">
<div style="display: flex; justify-content: space-between"><span>AREA</span><span style="color: #14232B">{{place}}</span></div>
<div style="display: flex; justify-content: space-between"><span>PHOTO TAKEN</span><span style="color: #14232B">{{when}}</span></div>
</div>
<div style="border-top: 3px dotted #9FB3BB"></div>
<div style="display: flex; justify-content: space-between; align-items: flex-end">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 26px; color: #3D4F57">NEA 1-HR PM2.5</div>
<div style="font-size: 30px; font-weight: 600">ELEVATED ▲</div>
</div>
<div style="font-family: 'Apfel Grotezk', sans-serif; font-size: 150px; font-weight: 700; line-height: 0.9; letter-spacing: -0.05em">{{pm}}</div>
</div>
<div style="display: flex; justify-content: space-between; font-size: 26px; color: #3D4F57"><span>READING FOR</span><span style="color: #14232B">5PM HOUR · SOUTH STATION</span></div>
<div style="border-top: 3px dotted #9FB3BB"></div>
<div style="display: flex; justify-content: space-between; align-items: center; font-size: 24px">
<span style="font-weight: 600">hazenow.pages.dev</span>
<span style="color: #3D4F57">OPEN SOURCE · BY {{credit}}</span>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"place":{"editor":"text","default":"SOUTH SINGAPORE"},"when":{"editor":"text","default":"MON 28 SEP · 5:04 PM"},"credit":{"editor":"text","default":"YONG QUAN TAN"},"$preview":{"width":1080,"height":1920}}'>
class Component extends DCLogic {
renderVals() {
return { place: this.props.place ?? 'SOUTH SINGAPORE', when: this.props.when ?? 'MON 28 SEP · 5:04 PM', credit: this.props.credit ?? 'YONG QUAN TAN', pm: 134 };
}
}
</script>
</body>
</html>
